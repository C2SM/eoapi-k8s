apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eoapi-stac-auth-ingress
  namespace: eoapi
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: localhost
      http:
        paths:
          - path: /stac
            pathType: Prefix
            backend:
              service:
                name: eoapi-stac-auth-proxy
                port:
                  number: 8080