suite: service account token tests
templates:
  - templates/_helpers/core.tpl
  - templates/_helpers/services.tpl
  - templates/_helpers/database.tpl
  - templates/_helpers/networking.tpl
  - templates/core/service-account.yaml
  - templates/core/knative-init.yaml
  - templates/services/stac/deployment.yaml
  - templates/services/stac/configmap.yaml
  - templates/services/raster/deployment.yaml
  - templates/services/raster/configmap.yaml
  - templates/services/browser/deployment.yaml
  - templates/services/doc-server.yaml
  - templates/services/narthex-backend/deployment.yaml
set:
  pgstacBootstrap:
    enabled: true
tests:
  - it: the service account automounts by default
    template: templates/core/service-account.yaml
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true

  # `default true` used to turn this false back into true.
  - it: serviceAccount.automount false reaches the service account
    template: templates/core/service-account.yaml
    set:
      serviceAccount.automount: false
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: by default the API pods keep the automounted token and get no extra volume
    template: templates/services/stac/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.automountServiceAccountToken
      - notExists:
          path: spec.template.spec.initContainers[0].volumeMounts
      - isNullOrEmpty:
          path: spec.template.spec.volumes

  - it: with automount false only wait-for-pgstac-jobs gets a token
    template: templates/services/stac/deployment.yaml
    set:
      serviceAccount.automount: false
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-pgstac-jobs
      - equal:
          path: spec.template.spec.initContainers[0].volumeMounts
          value:
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts
      - contains:
          path: spec.template.spec.volumes
          content:
            name: kube-api-access
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                    expirationSeconds: 3607
                - configMap:
                    name: kube-root-ca.crt
                    items:
                      - key: ca.crt
                        path: ca.crt
                - downwardAPI:
                    items:
                      - path: namespace
                        fieldRef:
                          fieldPath: metadata.namespace

  - it: the token volume sits next to the service's own extra volumes
    template: templates/services/raster/deployment.yaml
    set:
      serviceAccount.automount: false
      raster.settings.extraVolumes:
        - name: scratch
          emptyDir: {}
    asserts:
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 2
      - contains:
          path: spec.template.spec.volumes
          content:
            name: scratch
            emptyDir: {}

  - it: without pgstacBootstrap there is no init container and so no token volume
    template: templates/services/stac/deployment.yaml
    set:
      serviceAccount.automount: false
      pgstacBootstrap.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - isNullOrEmpty:
          path: spec.template.spec.volumes

  - it: browser drops its token with automount false
    template: templates/services/browser/deployment.yaml
    set:
      serviceAccount.automount: false
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: doc-server drops its token with automount false
    template: templates/services/doc-server.yaml
    documentIndex: 1
    set:
      serviceAccount.automount: false
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: narthex drops its token with automount false
    template: templates/services/narthex-backend/deployment.yaml
    set:
      narthex-backend.enabled: true
      serviceAccount.automount: false
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: knative-init keeps its token with automount false, since it runs kubectl
    template: templates/core/knative-init.yaml
    set:
      serviceAccount.automount: false
      knative.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
