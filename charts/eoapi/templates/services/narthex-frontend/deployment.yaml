{{- if index .Values "narthex-frontend" "enabled" }}
{{- $nf := index .Values "narthex-frontend" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-narthex-frontend
  labels:
    {{- include "eoapi.labels" . | nindent 4 }}
    app.kubernetes.io/component: narthex-frontend
    app: {{ .Release.Name }}-narthex-frontend
    gitsha: {{ include "eoapi.gitSha" . }}
spec:
  replicas: {{ $nf.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-narthex-frontend
  template:
    metadata:
      annotations:
        checksum/launch-configs: {{ include (print $.Template.BasePath "/services/narthex-frontend/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "eoapi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: narthex-frontend
        app: {{ .Release.Name }}-narthex-frontend
        {{- with $nf.settings.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $nf.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $nf.settings.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: launch-configs
          configMap:
            name: {{ .Release.Name }}-narthex-launch-configs
      containers:
        - name: narthex-frontend
          image: {{ include "eoapi.containerImage" $nf.image }}
          imagePullPolicy: {{ $nf.image.pullPolicy | default "IfNotPresent" }}
          {{- with $nf.settings.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 8080
          # nginx starts only after the entrypoint has written config.js, so any
          # 200 means the app is configured. From v1.2.2-beta.1 nginx answers
          # /healthz itself and keeps it out of the access log; older images
          # serve the SPA there, which also returns 200.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
          env:
            - name: NARTHEX_API_URL
              value: {{ $nf.apiUrl | quote }}
            - name: NARTHEX_AUTH_MODE
              value: {{ $nf.authMode | quote }}
            - name: NARTHEX_LOGOUT_URL
              value: {{ $nf.logoutUrl | quote }}
            - name: NARTHEX_OIDC_ISSUER
              value: {{ $nf.oidcIssuer | quote }}
            - name: NARTHEX_OIDC_CLIENT_ID
              value: {{ $nf.oidcClientId | default "narthex" | quote }}
            - name: NARTHEX_OIDC_REDIRECT_URI
              value: {{ $nf.oidcRedirectUri | quote }}
            - name: NARTHEX_OIDC_SCOPE
              value: {{ $nf.oidcScope | quote }}
            - name: NARTHEX_LAUNCH_CONFIGS_FILE
              value: /etc/narthex/launch-configs.yaml
          volumeMounts:
            - name: launch-configs
              mountPath: /etc/narthex/launch-configs.yaml
              subPath: launch-configs.yaml
              readOnly: true
          resources:
            {{- toYaml $nf.settings.resources | nindent 12 }}
      serviceAccountName: {{ include "eoapi.serviceAccountName" . }}
      {{- include "eoapi.podAutomountServiceAccountToken" . | nindent 6 }}
{{- end }}
