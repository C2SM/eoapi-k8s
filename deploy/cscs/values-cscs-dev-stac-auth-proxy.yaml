stac:
    enabled: true
    ingress:
        enabled: true
        path: "/stac"
    overrideRootPath: ""

stac-auth-proxy:
    enabled: true
    ingress:
        enabled: false
    env:
        UPSTREAM_URL: "http://eoapi-stac:8080"
        OIDC_DISCOVERY_URL: "https://auth-prometheus-dev.c2sm-tds.c2sm.cscs.ch/.well-known/openid-configuration"
        OIDC_DISCOVERY_INTERNAL_URL: "https://auth-prometheus-dev.c2sm-tds.c2sm.cscs.ch/.well-known/openid-configuration"
        # Only stac-browser's own access token reaches /stac; nothing injects
        # an Authorization header here. This is an ACCESS token audience, which
        # requires the client's access_token_signed_response_alg +
        # requested_audience_mode settings in authelia-configmap.yaml.
        ALLOWED_JWT_AUDIENCES: "stac-browser"
        ROOT_PATH: "/stac"
        ROOT_PATH_SKIP_PREFIXES: "/raster,/vector,/browser,/multidim"
        OVERRIDE_HOST: "false"
        DEFAULT_PUBLIC: "true"
        COLLECTIONS_FILTER_CLS: "stac_auth_proxy.custom_filters:CollectionsFilter"
        ITEMS_FILTER_CLS: "stac_auth_proxy.custom_filters:ItemsFilter"
    customFiltersFile: "data/stac-auth-proxy/custom_filters.py"
    extraVolumes:
        - name: filters
          configMap:
              name: eoapi-stac-auth-proxy-custom-filters
    extraVolumeMounts:
        - name: filters
          mountPath: /app/src/stac_auth_proxy/custom_filters.py
          subPath: custom_filters.py
          readOnly: true
