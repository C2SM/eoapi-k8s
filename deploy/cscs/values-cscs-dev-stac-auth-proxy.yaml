stac:
    enabled: true
    ingress:
        enabled: true
        path: "/stac"
    overrideRootPath: ""

stac-auth-proxy:
    enabled: true
    ingress:
        enabled: false
    env:
        UPSTREAM_URL: "http://eoapi-stac:8080"
        # OIDC_DISCOVERY_* and ALLOWED_JWT_AUDIENCES are set in
        # values-cscs-dev-auth-keycloak.yaml.
        ROOT_PATH: "/stac"
        ROOT_PATH_SKIP_PREFIXES: "/raster,/vector,/browser,/multidim"
        OVERRIDE_HOST: "false"
        DEFAULT_PUBLIC: "true"
        COLLECTIONS_FILTER_CLS: "stac_auth_proxy.custom_filters:CollectionsFilter"
        ITEMS_FILTER_CLS: "stac_auth_proxy.custom_filters:ItemsFilter"
        # The defaults plus the Catalogs extension's paths to the same
        # collections and items. The collections pattern is tried first, so it
        # must not match item paths. /catalogs/{id}/children is left out until
        # the server honours `filter` there (stac-fastapi-pgstac 7.2.0 doesn't).
        COLLECTIONS_FILTER_PATH: '^(/collections|/catalogs/[^/]+/collections)(/[^/]+)?$'
        ITEMS_FILTER_PATH: '^((/catalogs/[^/]+)?/collections/[^/]+/items(/[^/]+)?|/collections/[^/]+/bulk_items|/search)$'
    customFiltersFile: "data/stac-auth-proxy/custom_filters.py"
    extraVolumes:
        - name: filters
          configMap:
              name: eoapi-stac-auth-proxy-custom-filters
    extraVolumeMounts:
        - name: filters
          mountPath: /app/src/stac_auth_proxy/custom_filters.py
          subPath: custom_filters.py
          readOnly: true
