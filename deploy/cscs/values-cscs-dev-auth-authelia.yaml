# Attaches Authelia's ForwardAuth gate to the eoAPI ingress. Apply after
# values-cscs-dev.yaml so this middleware chain replaces the base one.
#
# References are <namespace>-<name>@kubernetescrd; a wrong name silently drops
# the whole router instead of failing, so check the rendered annotation with
# `helm template ... | grep router.middlewares`.
#
# No `errors` middleware: Authelia's ForwardAuth issues the redirect to its own
# login portal.
ingress:
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: "eoapi-dev-eoapi-dev-ipallowlist@kubernetescrd,eoapi-dev-eoapi-dev-authelia-forwardauth@kubernetescrd,eoapi-dev-eoapi-strip-prefix-middleware@kubernetescrd"
