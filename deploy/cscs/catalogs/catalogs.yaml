        children:
        - id: viirs-brdf-albedo-model-parameters-npp
          title: VIIRS BRDF parameters · Suomi NPP
          preview:
            href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=VIIRS_SNPP_SurfaceReflectance_BandsM11-M7-M5&STYLES=&SRS=EPSG:4326&BBOX=130,-31.9603,144,-25.0397&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg&TIME=2022-05-10"
