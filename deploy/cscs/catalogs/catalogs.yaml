# Catalog tree served by the stac-fastapi-pgstac Catalogs extension
# (/stac/catalogs/<id>, browsable at /browser/catalogs/prometheus).
# Each entry becomes a `type: Catalog` row in pgstac.collections; nesting
# becomes `parent_ids`. Which collections land in which leaf is decided by the
# rules in load_catalogs.py, which also reads this file.
#
# preview: image shown on the catalog's card and page. Must be JPEG/PNG/WebP
# (stac-browser does not display SVG thumbnails).

- id: prometheus
  title: PromETHeus
  preview:
    href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=BlueMarble_ShadedRelief_Bathymetry&STYLES=&SRS=EPSG:4326&BBOX=-160,-90,160,90&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg"
    type: image/jpeg
    title: "NASA GIBS: BlueMarble_ShadedRelief_Bathymetry"
  description: |
    Earth-observation, field-campaign and model data catalogued by C2SM on
    CSCS infrastructure, grouped by mission, product family and campaign.

    Every collection also appears, ungrouped, in the full collection list on the
    API landing page, and all of them can be found with the search.

    Preview images: we acknowledge the use of imagery provided by services from
    NASA's Global Imagery Browse Services (GIBS), part of NASA's Earth Science
    Data and Information System (ESDIS). Where GIBS has no layer for a group's
    own data, the image is an illustration of the same region or theme.
  children:

  - id: c2sm-model-output
    title: C2SM model output
    preview:
      href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=MERRA2_Surface_Wind_Speed_Monthly&STYLES=&SRS=EPSG:4326&BBOX=-160,-90,160,90&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg&TIME=2023-08-01"
      type: image/jpeg
      title: "NASA GIBS: MERRA2_Surface_Wind_Speed_Monthly, 2023-08-01"
    description: |
      Simulations produced or post-processed at C2SM and stored at CSCS.
    children:
    - id: dyamond
      title: DYAMOND
      preview:
        href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=VIIRS_NOAA20_CorrectedReflectance_TrueColor&STYLES=&SRS=EPSG:4326&BBOX=-145,-82,125,70&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg&TIME=2020-02-01"
        type: image/jpeg
        title: "NASA GIBS: VIIRS_NOAA20_CorrectedReflectance_TrueColor, 2020-02-01"
      description: |
        Global storm-resolving ICON simulations following the DYAMOND
        (DYnamics of the Atmospheric general circulation Modeled On
        Non-hydrostatic Domains) protocol, starting 20 January 2020.

        Runs at R02B06 (~40 km), R02B08 (~10 km) and R02B10 (~2.5 km), including
        the OpenACC GPU port, ICON-EXCLAIM and a shallow-convection-only
        experiment. Output streams hold one variable per file, on the native ICON
        grid or remapped to a regular latitude-longitude grid.

  - id: modis
    title: MODIS
    preview:
      href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=MODIS_Aqua_CorrectedReflectance_TrueColor&STYLES=&SRS=EPSG:4326&BBOX=-83,21.9407,-73,27.0593&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg&TIME=2021-03-10"
      type: image/jpeg
      title: "NASA GIBS: MODIS_Aqua_CorrectedReflectance_TrueColor, 2021-03-10"
    description: |
      Land products from the Moderate Resolution Imaging Spectroradiometer on
      NASA's Terra (morning orbit, since 2000) and Aqua (afternoon orbit, since
      2002) satellites, distributed by the LP DAAC. 36 spectral bands at 250 m to
      1 km.

      Titles follow NASA's pattern *platform / product / cadence / level / grid /
      version*: `Terra+Aqua` means combined, `SIN Grid` products are tiled,
      `CMG` products are global 0.05° grids, and `V006`/`V061` are Collections 6
      and 6.1.
    children:
    - id: modis-brdf-albedo
      title: MODIS BRDF/Albedo
      preview:
        href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=MODIS_Combined_L3_Black_Sky_Albedo_Daily&STYLES=&SRS=EPSG:4326&BBOX=70,23.4135,106,40.5865&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg&TIME=2023-03-15"
        type: image/jpeg
        title: "NASA GIBS: MODIS_Combined_L3_Black_Sky_Albedo_Daily, 2023-03-15"
      description: |
        The MCD43 family: a kernel-driven model of how surface reflectance varies
        with view and sun angle (the BRDF), fitted daily from 16 days of Terra and
        Aqua observations, and the albedo and nadir reflectance derived from it.

        Most products come as one collection per spectral band, which is why this
        group is large.
      children:
      - id: modis-brdf-albedo-albedo
        title: MODIS albedo
        preview:
          href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=BlueMarble_ShadedRelief_Bathymetry,MODIS_Combined_L3_White_Sky_Albedo_Daily&STYLES=&SRS=EPSG:4326&BBOX=0,4.1427,60,35.8573&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg&TIME=2023-06-15"
          type: image/jpeg
          title: "NASA GIBS: BlueMarble_ShadedRelief_Bathymetry, MODIS_Combined_L3_White_Sky_Albedo_Daily, 2023-06-15"
        description: |
          Black-sky (directional) and white-sky (diffuse) albedo at local solar
          noon, per band and for the visible, near-infrared and shortwave
          broadbands.
      - id: modis-brdf-albedo-model-parameters
        title: MODIS BRDF model parameters
        preview:
          href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=MODIS_Combined_MAIAC_L3_IsotropicKernelParameters&STYLES=&SRS=EPSG:4326&BBOX=112.5,-35.4875,156.5,-12.9125&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg&TIME=2022-09-16"
          type: image/jpeg
          title: "NASA GIBS: MODIS_Combined_MAIAC_L3_IsotropicKernelParameters, 2022-09-16"
        description: |
          The three kernel weights (isotropic, volumetric, geometric) of the
          BRDF model, per band. Use these to compute reflectance or albedo for
          any sun and view geometry.
      - id: modis-brdf-albedo-nbar
        title: MODIS nadir BRDF-adjusted reflectance
        preview:
          href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=MODIS_Combined_L3_Nadir-BRDF_Daily&STYLES=&SRS=EPSG:4326&BBOX=0,44.3856,28,54.6144&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg&TIME=2023-08-15"
          type: image/jpeg
          title: "NASA GIBS: MODIS_Combined_L3_Nadir-BRDF_Daily, 2023-08-15"
        description: |
          Surface reflectance normalised to a nadir view at local solar noon
          (NBAR): free of view-angle effects, so pixels and dates are directly
          comparable.
      - id: modis-brdf-albedo-quality
        title: MODIS BRDF/Albedo quality
        preview:
          href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=MODIS_Terra_L3_Land_Water_Mask&STYLES=&SRS=EPSG:4326&BBOX=-95,48.5473,-55,61.4527&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg&TIME=2015-01-01"
          type: image/jpeg
          title: "NASA GIBS: MODIS_Terra_L3_Land_Water_Mask, 2015-01-01"
        description: |
          Quality flags, snow status, local solar noon, valid-observation counts
          and uncertainty layers that accompany the BRDF/Albedo products.
    - id: modis-land-surface-temperature
      title: MODIS land surface temperature
      preview:
        href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=BlueMarble_ShadedRelief_Bathymetry,MODIS_Terra_L3_Land_Surface_Temp_Monthly_Day&STYLES=&SRS=EPSG:4326&BBOX=-15,3.2073,95,56.7927&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg&TIME=2022-07-01"
        type: image/jpeg
        title: "NASA GIBS: BlueMarble_ShadedRelief_Bathymetry, MODIS_Terra_L3_Land_Surface_Temp_Monthly_Day, 2022-07-01"
      description: |
        Land surface temperature and emissivity: the split-window products
        (MOD11/MYD11) and the three-band temperature-emissivity separation
        products (MOD21/MYD21), from 5-minute swaths to 8-day and monthly
        global grids.
    - id: modis-vegetation
      title: MODIS vegetation
      preview:
        href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=BlueMarble_ShadedRelief_Bathymetry,MODIS_Terra_L3_NDVI_Monthly&STYLES=&SRS=EPSG:4326&BBOX=0,-3.1405,40,19.1405&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg&TIME=2022-08-01"
        type: image/jpeg
        title: "NASA GIBS: BlueMarble_ShadedRelief_Bathymetry, MODIS_Terra_L3_NDVI_Monthly, 2022-08-01"
      description: |
        Vegetation indices (NDVI, EVI), leaf area index and the fraction of
        absorbed photosynthetically active radiation (LAI/FPAR), land cover
        dynamics (phenology) and vegetation continuous fields.
    - id: modis-productivity-et
      title: MODIS productivity & evapotranspiration
      preview:
        href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=BlueMarble_ShadedRelief_Bathymetry,MODIS_Terra_L4_Gross_Primary_Productivity_8Day&STYLES=&SRS=EPSG:4326&BBOX=-125,33.0676,-65,56.9324&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg&TIME=2022-07-12"
        type: image/jpeg
        title: "NASA GIBS: BlueMarble_ShadedRelief_Bathymetry, MODIS_Terra_L4_Gross_Primary_Productivity_8Day, 2022-07-12"
      description: |
        Gross and net primary productivity (MOD17), evapotranspiration and
        latent heat flux (MOD16), and photosynthetically active radiation,
        including the gap-filled versions.
    - id: modis-surface-reflectance
      title: MODIS surface reflectance
      preview:
        href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=MODIS_Terra_L3_SurfaceReflectance_Bands721_8Day&STYLES=&SRS=EPSG:4326&BBOX=37.5,19.6804,62.5,32.3196&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg&TIME=2022-10-08"
        type: image/jpeg
        title: "NASA GIBS: MODIS_Terra_L3_SurfaceReflectance_Bands721_8Day, 2022-10-08"
      description: |
        Atmospherically corrected surface reflectance (MOD09/MYD09), including
        the MAIAC products, which also carry aerosol, water vapour and snow
        layers.
    - id: modis-fire
      title: MODIS fire
      preview:
        href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=MODIS_Terra_CorrectedReflectance_TrueColor,MODIS_Combined_Thermal_Anomalies_All&STYLES=&SRS=EPSG:4326&BBOX=-125,33.787,-113,39.213&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg&TIME=2020-09-09"
        type: image/jpeg
        title: "NASA GIBS: MODIS_Terra_CorrectedReflectance_TrueColor, MODIS_Combined_Thermal_Anomalies_All, 2020-09-09"
      description: |
        Thermal anomalies and active fire detections (MOD14/MYD14), and monthly
        direct-broadcast burned area.
    - id: modis-land-cover-water
      title: MODIS land cover & water
      preview:
        href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=MODIS_Combined_L3_IGBP_Land_Cover_Type_Annual&STYLES=&SRS=EPSG:4326&BBOX=-7.5,41.8647,37.5,58.1353&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg&TIME=2022-01-01"
        type: image/jpeg
        title: "NASA GIBS: MODIS_Combined_L3_IGBP_Land_Cover_Type_Annual, 2022-01-01"
      description: |
        Annual land cover type (500 m and 0.05°), water reservoir area, and the
        250 m land-water mask derived from MODIS and SRTM.
    - id: modis-radiation-aerosol
      title: MODIS radiation & aerosol
      preview:
        href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=MODIS_Aqua_CorrectedReflectance_TrueColor,MODIS_Combined_MAIAC_L2G_AerosolOpticalDepth&STYLES=&SRS=EPSG:4326&BBOX=70,21.9881,90,32.0119&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg&TIME=2019-11-20"
        type: image/jpeg
        title: "NASA GIBS: MODIS_Aqua_CorrectedReflectance_TrueColor, MODIS_Combined_MAIAC_L2G_AerosolOpticalDepth, 2019-11-20"
      description: |
        Downward shortwave and surface radiation, and aerosol optical depth over
        land.

  - id: viirs
    title: VIIRS
    preview:
      href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=VIIRS_SNPP_CorrectedReflectance_TrueColor&STYLES=&SRS=EPSG:4326&BBOX=4.5,38.6558,20.5,45.3442&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg&TIME=2022-07-20"
      type: image/jpeg
      title: "NASA GIBS: VIIRS_SNPP_CorrectedReflectance_TrueColor, 2022-07-20"
    description: |
      Land products from the Visible Infrared Imaging Radiometer Suite on Suomi
      NPP (since 2011), NOAA-20 / JPSS-1 (since 2017) and NOAA-21 / JPSS-2
      (since 2022), distributed by the LP DAAC. VIIRS continues the MODIS land
      record at 375 m and 750 m.

      Titles name the satellite (`NPP`, `JPSS1`, `JPSS2`) and the version
      (`V001`, `V002`).
    children:
    - id: viirs-brdf-albedo
      title: VIIRS BRDF/Albedo
      preview:
        href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=VIIRS_SNPP_L3_SurfaceReflectance_BandsM5-M4-M3_8Day&STYLES=&SRS=EPSG:4326&BBOX=5,44.564,15,48.436&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg&TIME=2022-02-18"
        type: image/jpeg
        title: "NASA GIBS: VIIRS_SNPP_L3_SurfaceReflectance_BandsM5-M4-M3_8Day, 2022-02-18"
      description: |
        The VNP43 family (and its JPSS equivalents): the same kernel-driven BRDF
        model as MODIS MCD43, fitted daily per satellite, plus the albedo and
        nadir reflectance derived from it, including Day/Night Band products.

        With one collection per band and per satellite, albedo and model
        parameters are split further by satellite.
      children:
      - id: viirs-brdf-albedo-albedo
        title: VIIRS albedo
        preview:
          href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=VIIRS_SNPP_CorrectedReflectance_TrueColor&STYLES=&SRS=EPSG:4326&BBOX=77,25.6157,95,34.3843&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg&TIME=2021-12-10"
          type: image/jpeg
          title: "NASA GIBS: VIIRS_SNPP_CorrectedReflectance_TrueColor, 2021-12-10"
        description: |
          Black-sky (directional) and white-sky (diffuse) albedo at local solar
          noon, per band and broadband, one group per satellite.
        children:
        - id: viirs-brdf-albedo-albedo-npp
          title: VIIRS albedo · Suomi NPP
          preview:
            href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=VIIRS_SNPP_SurfaceReflectance_BandsM5-M4-M3&STYLES=&SRS=EPSG:4326&BBOX=-70.5,-21.7837,-64.5,-18.6163&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg&TIME=2022-08-15"
            type: image/jpeg
            title: "NASA GIBS: VIIRS_SNPP_SurfaceReflectance_BandsM5-M4-M3, 2022-08-15"
          description: Black-sky and white-sky albedo from VIIRS on Suomi NPP.
        - id: viirs-brdf-albedo-albedo-jpss1
          title: VIIRS albedo · NOAA-20 (JPSS-1)
          preview:
            href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=VIIRS_NOAA20_CorrectedReflectance_TrueColor&STYLES=&SRS=EPSG:4326&BBOX=-77,-50.9613,-69,-48.0387&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg&TIME=2022-02-04"
            type: image/jpeg
            title: "NASA GIBS: VIIRS_NOAA20_CorrectedReflectance_TrueColor, 2022-02-04"
          description: Black-sky and white-sky albedo from VIIRS on NOAA-20 (JPSS-1).
        - id: viirs-brdf-albedo-albedo-jpss2
          title: VIIRS albedo · NOAA-21 (JPSS-2)
          preview:
            href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=VIIRS_NOAA21_CorrectedReflectance_TrueColor&STYLES=&SRS=EPSG:4326&BBOX=-22.7,63.9456,-14.7,65.8544&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg&TIME=2024-07-07"
            type: image/jpeg
            title: "NASA GIBS: VIIRS_NOAA21_CorrectedReflectance_TrueColor, 2024-07-07"
          description: Black-sky and white-sky albedo from VIIRS on NOAA-21 (JPSS-2).
      - id: viirs-brdf-albedo-model-parameters
        title: VIIRS BRDF model parameters
        preview:
          href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=VIIRS_SNPP_CorrectedReflectance_BandsM11-I2-I1&STYLES=&SRS=EPSG:4326&BBOX=28.5,29.3896,33.5,31.8104&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg&TIME=2022-11-10"
          type: image/jpeg
          title: "NASA GIBS: VIIRS_SNPP_CorrectedReflectance_BandsM11-I2-I1, 2022-11-10"
        description: |
          The three kernel weights (isotropic, volumetric, geometric) of the BRDF
