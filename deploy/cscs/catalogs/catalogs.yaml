    - id: viirs-land-surface-temperature
      title: VIIRS land surface temperature
      preview:
        href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=BlueMarble_ShadedRelief_Bathymetry,VIIRS_SNPP_L3_Land_Surface_Temp_Monthly_Day&STYLES=&SRS=EPSG:4326&BBOX=110,-38.1337,158,-13.8663&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg&TIME=2023-01-01"
        type: image/jpeg
        title: "NASA GIBS: BlueMarble_ShadedRelief_Bathymetry, VIIRS_SNPP_L3_Land_Surface_Temp_Monthly_Day, 2023-01-01"
