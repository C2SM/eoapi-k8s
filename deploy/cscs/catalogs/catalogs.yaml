        title: VIIRS BRDF/Albedo quality
        preview:
          href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=VIIRS_SNPP_Clear_Sky_Confidence_Day&STYLES=&SRS=EPSG:4326&BBOX=-10,37.045,30,52.955&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg&TIME=2022-07-20"
