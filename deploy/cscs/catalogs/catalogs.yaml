            type: image/jpeg
            title: "NASA GIBS: VIIRS_NOAA21_CorrectedReflectance_BandsM11-I2-I1, 2024-05-19"
          description: BRDF model parameters from VIIRS on NOAA-21 (JPSS-2).
      - id: viirs-brdf-albedo-nbar
        title: VIIRS nadir BRDF-adjusted reflectance
        preview:
          href: "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&LAYERS=VIIRS_SNPP_L3_SurfaceReflectance_BandsM5-M4-M3_8Day&STYLES=&SRS=EPSG:4326&BBOX=22,3.3525,46,16.6475&WIDTH=640&HEIGHT=360&FORMAT=image/jpeg&TIME=2022-10-08"
          type: image/jpeg
          title: "NASA GIBS: VIIRS_SNPP_L3_SurfaceReflectance_BandsM5-M4-M3_8Day, 2022-10-08"
