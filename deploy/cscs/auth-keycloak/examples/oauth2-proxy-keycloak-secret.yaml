# Documentation only - never apply this file, and never commit real values.
# Create the real Secret with `kubectl create secret` as shown in ../README.md.
#
# `kubectl apply -f deploy/cscs/auth-keycloak/` does not recurse, so nothing in
# this examples/ directory is ever applied by the deploy step.
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-keycloak-secret
  namespace: eoapi-dev
type: Opaque
stringData:
  # Issued by CSCS for the confidential `prometheus-tds` client.
  client-secret: "<KEYCLOAK_CLIENT_SECRET>"
  # openssl rand -base64 32 | tr -- '+/' '-_'
  cookie-secret: "<BASE64_URL_SAFE_32_BYTES>"
