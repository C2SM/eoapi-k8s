apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: eoapi-dev-oauth-forwardauth
  namespace: eoapi-dev
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/part-of: eoapi-dev-auth-dex
spec:
  forwardAuth:
    address: http://eoapi-dev-oauth2-proxy.eoapi-dev.svc.cluster.local:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - Authorization
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Groups
      - X-Auth-Request-Preferred-Username
      - X-Forwarded-User
      - X-Forwarded-Email
      - X-Forwarded-Groups
      - X-Forwarded-Preferred-Username
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: eoapi-dev-oauth-errors
  namespace: eoapi-dev
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/part-of: eoapi-dev-auth-dex
spec:
  errors:
    status:
      - "401-403"
    service:
      name: eoapi-dev-oauth2-proxy
      port: 4180
    query: /oauth2/sign_in?rd=/browser/
    statusRewrites:
      "401": 302
