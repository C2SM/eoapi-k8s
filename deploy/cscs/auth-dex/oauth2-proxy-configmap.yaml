apiVersion: v1
kind: ConfigMap
metadata:
  name: eoapi-dev-oauth2-proxy-config
  namespace: eoapi-dev
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/part-of: eoapi-dev-auth-dex
data:
  oauth2-proxy.cfg: |
    http_address = "0.0.0.0:4180"
    provider = "oidc"
    provider_display_name = "Dex"
    oidc_issuer_url = "https://dex-prometheus-dev.c2sm-tds.c2sm.cscs.ch"
    oidc_groups_claim = "groups"
    redirect_url = "https://prometheus-dev.c2sm-tds.c2sm.cscs.ch/oauth2/callback"
    proxy_prefix = "/oauth2"
    skip_provider_button = true

    # oauth2-proxy defaults approval_prompt to "force", which sends
    # approval_prompt=force on every authorization request and overrides
    # Dex's own oauth2.skipApprovalScreen: true - producing a "Grant Access"
    # consent click on every single login. "auto" is the legacy Google-compat
    # counterpart of "force" and stops the parameter being sent at all.
    #
    # An empty string does NOT work here: oauth2-proxy treats an empty value
    # as unset and falls back to its own "force" default. `prompt` is left
    # unset too - it would supersede this, and none of its valid OIDC values
    # ("none"/"login"/"consent") mean "default behaviour".
    approval_prompt = "auto"

    email_domains = ["*"]
    allowed_groups = ["/eoapi-dev-users"]
    scope = "openid email profile groups"

    # oauth2-proxy's own client (below, via client-id) issues tokens with
    # aud=eoapi-dev; stac-browser is a second Dex client (same issuer) whose
    # tokens carry aud=stac-browser. Without this, oauth2-proxy's ForwardAuth
    # rejects any Authorization: Bearer request from stac-browser with 403
    # ("audience ... does not match with any of allowed audiences").
    oidc_extra_audiences = ["stac-browser"]

    # /stac already has its own dedicated auth layer (stac-auth-proxy: real
    # JWT validation, DEFAULT_PUBLIC=true, clean JSON 401s, group-based CQL
    # filtering via custom_filters.py). Double-gating it here breaks
    # stac-browser's background XHR calls: this whole-site ForwardAuth gate
    # answers an unauthenticated request with an HTML 302 to Dex, which a
    # fetch()/XHR call auto-follows into a cross-origin, non-CORS-enabled
    # page, surfacing as an opaque "CORS blocked" error - and a failed
    # bearer-authenticated request here also clears the existing whole-site
    # session cookie as a side effect, breaking cookie-only browsing too.
    #
    # /browser is skipped too so an anonymous visitor can reach the STAC
    # Browser UI itself and see public collections without ever logging in -
    # the UI is just static JS/HTML with nothing sensitive baked in; actual
    # data access is still governed entirely by stac-auth-proxy's own
    # auth:groups-based filtering on /stac, unaffected by this.
    #
    # narthex-backend/narthex-frontend moved to their own subdomain
    # (narthex-prometheus-dev.*, see deploy/cscs/narthex-ingress.yaml) so
    # they're not on this host/gate at all any more - no /narthex entry
    # needed here.
    #
    # /raster, /vector, /multidim have no auth proxy of their own yet, so
    # they intentionally stay behind this gate.
    skip_auth_routes = ["^/(stac|browser)(/|$)"]

    # CORS preflights carry no Authorization header and no cookie (browsers
    # strip credentials from OPTIONS by spec), so ForwardAuth would reject
    # them and the real request would never be sent. That breaks the
    # stac-browser SaveToNarthex widget, whose calls to narthex's /api are
    # cross-origin. Let preflights through; the actual request behind them
    # is still fully authenticated.
    skip_auth_preflight = true

    upstreams = ["static://202"]
    reverse_proxy = true
    set_xauthrequest = true
    pass_user_headers = true
    skip_jwt_bearer_tokens = true
    bearer_token_login_fallback = false
    set_authorization_header = true

    cookie_name = "__Secure-eoapi-dev-oauth2"
    cookie_secure = true
    cookie_samesite = "lax"

    # Scope the session cookie to the shared parent domain so ONE login
    # covers every app on the family (prometheus-dev.*, and
    # narthex-prometheus-dev.* which sits behind the same ForwardAuth gate).
    # This is what makes oauth2-proxy - not Dex - the session authority:
    # Dex has no browser SSO session in any released version (the
    # `sessions:` feature with ssoSharedWithDefault is master-only, see
    # dexidp/dex#4560), so each distinct OIDC client_id would otherwise
    # force a fresh interactive login on every app switch.
    #
    # whitelist_domains is required for the post-login `rd` redirect to be
    # allowed to land on a *different* host than the one that started the
    # flow (see narthex-oauth-errors in ../narthex-ingress.yaml, whose rd
    # points back at the narthex subdomain).
    cookie_domains = [".c2sm-tds.c2sm.cscs.ch"]
    whitelist_domains = [".c2sm-tds.c2sm.cscs.ch"]
