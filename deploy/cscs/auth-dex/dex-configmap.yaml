apiVersion: v1
kind: ConfigMap
metadata:
  name: eoapi-dev-dex-config
  namespace: eoapi-dev
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: eoapi-dev-auth-dex
data:
  config.yaml: |
    issuer: https://dex-prometheus-dev.c2sm-tds.c2sm.cscs.ch

    storage:
      type: memory

    web:
      http: 0.0.0.0:5556
      # Without this, browsers block stac-browser's own oidc-client-ts fetch of
      # this discovery doc (and the token endpoint) as a cross-origin request,
      # since dex-prometheus-dev.* is a different origin than prometheus-dev.*
      # (CORS is disabled by Dex when this list is empty).
      allowedOrigins:
        - https://prometheus-dev.c2sm-tds.c2sm.cscs.ch

    frontend:
      issuer: Prometheus

    oauth2:
      skipApprovalScreen: true
      passwordConnector: local

    staticClients:
      - id: eoapi-dev
        name: eoAPI CSCS dev
        secretEnv: DEX_EOAPI_CLIENT_SECRET
        redirectURIs:
          - https://prometheus-dev.c2sm-tds.c2sm.cscs.ch/oauth2/callback
      - id: stac-browser
        name: STAC Browser
        public: true
        redirectURIs:
          - https://prometheus-dev.c2sm-tds.c2sm.cscs.ch/browser/auth

    enablePasswordDB: true
    staticPasswords:
      - email: kservis@example.org
        hashFromEnv: DEX_KSERVIS_USER_HASH
        username: kservis
        preferredUsername: kservis
        name: kservis
        userID: kservis
        groups:
          - /eoapi-dev-users
          - /eoapi-admin
      - email: noaa-reader@example.org
        hashFromEnv: DEX_NOAA_READER_USER_HASH
        username: noaa-reader
        preferredUsername: noaa-reader
        name: eoAPI NOAA Reader
        userID: noaa-reader
        groups:
          - /eoapi-dev-users
          - /eoapi-noaa
      - email: nasa-reader@example.org
        hashFromEnv: DEX_NASA_READER_USER_HASH
        username: nasa-reader
        preferredUsername: nasa-reader
        name: eoAPI NASA Reader
        userID: nasa-reader
        groups:
          - /eoapi-dev-users
          - /nasa-users
      - email: dyamond-reader@example.org
        hashFromEnv: DEX_DYAMOND_READER_USER_HASH
        username: dyamond-reader
        preferredUsername: dyamond-reader
        name: eoAPI DYAMOND Reader
        userID: dyamond-reader
        groups:
          - /eoapi-dev-users
          - /dyamond-users
