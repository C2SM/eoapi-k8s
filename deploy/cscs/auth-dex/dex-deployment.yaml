apiVersion: apps/v1
kind: Deployment
metadata:
  name: eoapi-dev-dex
  namespace: eoapi-dev
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: eoapi-dev-auth-dex
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dex
      app.kubernetes.io/part-of: eoapi-dev-auth-dex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dex
        app.kubernetes.io/part-of: eoapi-dev-auth-dex
    spec:
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.45.1
          command:
            - /usr/local/bin/dex
          args:
            - serve
            - /etc/dex/config.yaml
          ports:
            - name: http
              containerPort: 5556
          env:
            - name: DEX_EOAPI_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dex-secret
                  key: client-secret
            - name: DEX_KSERVIS_USER_HASH
              valueFrom:
                secretKeyRef:
                  name: dex-secret
                  key: kservis-user-hash
            - name: DEX_NOAA_READER_USER_HASH
              valueFrom:
                secretKeyRef:
                  name: dex-secret
                  key: noaa-reader-user-hash
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/dex/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: eoapi-dev-dex-config
