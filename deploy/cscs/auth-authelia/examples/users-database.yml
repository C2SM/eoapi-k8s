# Documentation only - the real file carries argon2 hashes and is supplied via
# the `authelia-secret` Secret (key `users-database.yml`), never committed.
#
# Groups MUST keep the leading slash: custom_filters.py maps '/eoapi-noaa' ->
# noaa etc., and dropping it silently reduces every user to public collections.
# Every user needs '/eoapi-dev-users', the whole-site gate.
#
# The map key is the username; email login also works.
users:
  kservis:
    disabled: false
    displayname: 'kservis'
    password: '<ARGON2_HASH_FOR_KSERVIS_PASSWORD>'
    email: 'kservis@example.org'
    groups:
      - '/eoapi-dev-users'
      - '/eoapi-admin'
  noaa-reader:
    disabled: false
    displayname: 'eoAPI NOAA Reader'
    password: '<ARGON2_HASH_FOR_NOAA_READER_PASSWORD>'
    email: 'noaa-reader@example.org'
    groups:
      - '/eoapi-dev-users'
      - '/eoapi-noaa'
  nasa-reader:
    disabled: false
    displayname: 'eoAPI NASA Reader'
    password: '<ARGON2_HASH_FOR_NASA_READER_PASSWORD>'
    email: 'nasa-reader@example.org'
    groups:
      - '/eoapi-dev-users'
      - '/nasa-users'
  dyamond-reader:
    disabled: false
    displayname: 'eoAPI DYAMOND Reader'
    password: '<ARGON2_HASH_FOR_DYAMOND_READER_PASSWORD>'
    email: 'dyamond-reader@example.org'
    groups:
      - '/eoapi-dev-users'
      - '/dyamond-users'
