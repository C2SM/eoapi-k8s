# Documentation only - the real file carries argon2 password hashes and is
# supplied through the `authelia-secret` Secret (key `users-database.yml`),
# never committed. See ../README.md for how to generate the hashes.
#
# This is the Authelia equivalent of Dex's `staticPasswords`. Two things carry
# over deliberately:
#
#  1. The GROUPS KEEP THEIR LEADING SLASH. Authelia treats group names as
#     arbitrary strings, so the Keycloak-style form survives untouched. That is
#     what lets charts/eoapi/data/stac-auth-proxy/custom_filters.py stay
#     byte-identical: it maps '/eoapi-noaa' -> noaa, '/nasa-users' -> nasa,
#     '/dyamond-users' -> dyamond, and bypasses filtering for '/eoapi-admin'.
#     Dropping the slash would silently strip every user's dataset access down
#     to the public collections.
#
#  2. Every user is in '/eoapi-dev-users'. That group is the whole-site
#     authorization gate, enforced both by Authelia's access_control rules and
#     by the `eoapi_users` authorization_policy on each OIDC client.
#
# The map key is the username. `authentication_backend.file.search.email: true`
# is enabled, so users can sign in with either the username or the email
# address (Dex users signed in with their email).
users:
  kservis:
    disabled: false
    displayname: 'kservis'
    password: '<ARGON2_HASH_FOR_KSERVIS_PASSWORD>'
    email: 'kservis@example.org'
    groups:
      - '/eoapi-dev-users'
      - '/eoapi-admin'
  noaa-reader:
    disabled: false
    displayname: 'eoAPI NOAA Reader'
    password: '<ARGON2_HASH_FOR_NOAA_READER_PASSWORD>'
    email: 'noaa-reader@example.org'
    groups:
      - '/eoapi-dev-users'
      - '/eoapi-noaa'
  nasa-reader:
    disabled: false
    displayname: 'eoAPI NASA Reader'
    password: '<ARGON2_HASH_FOR_NASA_READER_PASSWORD>'
    email: 'nasa-reader@example.org'
    groups:
      - '/eoapi-dev-users'
      - '/nasa-users'
  dyamond-reader:
    disabled: false
    displayname: 'eoAPI DYAMOND Reader'
    password: '<ARGON2_HASH_FOR_DYAMOND_READER_PASSWORD>'
    email: 'dyamond-reader@example.org'
    groups:
      - '/eoapi-dev-users'
      - '/dyamond-users'
