# Documentation only - never apply this file, and never commit real values.
# Create the real Secret with `kubectl create secret` as shown in ../README.md.
#
# `kubectl apply -f deploy/cscs/auth-authelia/` does not recurse, so nothing in
# this examples/ directory is ever applied by the deploy step.
apiVersion: v1
kind: Secret
metadata:
  name: authelia-secret
  namespace: eoapi-dev
type: Opaque
stringData:
  # openssl rand -hex 64
  session-secret: "<RANDOM_ALPHANUMERIC_64+>"
  # openssl rand -hex 64
  storage-encryption-key: "<RANDOM_ALPHANUMERIC_64+>"
  # openssl rand -hex 64
  oidc-hmac-secret: "<RANDOM_ALPHANUMERIC_64+>"
  # openssl rand -hex 64  (unused in practice: password reset is disabled, but
  # the config key is validated at startup)
  identity-validation-jwt-secret: "<RANDOM_ALPHANUMERIC_64+>"
  # openssl genrsa -out oidc-jwks.pem 4096
  # Inlined into identity_providers.oidc.jwks[0].key by Authelia's `template`
  # config filter. Keep it stable: rotating it invalidates every issued token
  # and every cached JWKS.
  oidc-jwks.pem: |
    -----BEGIN PRIVATE KEY-----
    <RSA_PRIVATE_KEY_AT_LEAST_2048_BITS>
    -----END PRIVATE KEY-----
  # See users-database.yml in this directory.
  users-database.yml: |
    users: {}
