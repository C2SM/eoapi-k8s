apiVersion: v1
kind: ConfigMap
metadata:
  name: eoapi-dev-authelia-config
  namespace: eoapi-dev
  labels:
    app.kubernetes.io/name: authelia
    app.kubernetes.io/part-of: eoapi-dev-auth-authelia
data:
  configuration.yml: |
    # Authelia is the OIDC provider, the shared browser session, and the
    # ForwardAuth gate for the paths with no auth of their own.
    #
    # No secrets here: session.secret, storage.encryption_key,
    # identity_providers.oidc.hmac_secret, the OIDC signing key and the users
    # database all come from the `authelia-secret` Secret. See README.md.

    theme: 'auto'

    server:
      address: 'tcp://0.0.0.0:9091/'
      endpoints:
        authz:
          forward-auth:
            implementation: 'ForwardAuth'
            # CookieSession only. The default also enables HeaderAuthorization,
            # which hard-401s any request carrying a bearer token Authelia
            # cannot validate as one of its own - no redirect, no fallback to
            # the session cookie.
            authn_strategies:
              - name: 'CookieSession'

    log:
      level: 'info'

    totp:
      disable: true
    webauthn:
      disable: true
    duo_api:
      disable: true

    identity_validation:
      reset_password:
        jwt_lifespan: '5m'

    authentication_backend:
      password_reset:
        disable: true
      password_change:
        disable: true
      file:
        path: '/secrets/users-database.yml'
        watch: true
        search:
          email: true
        password:
          algorithm: 'argon2'

    access_control:
      default_policy: 'deny'
      rules:
        # These rules apply only to requests that reach Authelia's authz
        # endpoint, i.e. hosts carrying the eoapi-dev-authelia-forwardauth
        # middleware. Only the eoAPI host does.
        - domain: 'prometheus-dev.c2sm-tds.c2sm.cscs.ch'
          policy: 'bypass'
          methods:
            - 'OPTIONS'
        # /stac authenticates itself (stac-auth-proxy); /browser is public
        # static UI. Gating either kills anonymous access to public
        # collections and turns stac-browser's XHR into opaque CORS errors.
        - domain: 'prometheus-dev.c2sm-tds.c2sm.cscs.ch'
          policy: 'bypass'
          resources:
            - '^/stac(/|$)'
            - '^/browser(/|$)'
        - domain: 'prometheus-dev.c2sm-tds.c2sm.cscs.ch'
          policy: 'one_factor'
          subject:
            - 'group:/eoapi-dev-users'

    session:
      name: 'authelia_session'
      same_site: 'lax'
      inactivity: '4h'
      expiration: '12h'
      remember_me: '1M'
      # Without a provider here Authelia keeps sessions in memory, so every
      # restart of this pod - a config edit, an image bump, a node drain -
      # signs everyone out of every app. See authelia-redis.yaml.
      redis:
        host: 'eoapi-dev-authelia-redis.eoapi-dev.svc.cluster.local'
        port: 6379
        database_index: 0
      cookies:
        # One cookie for the whole family, so one login covers every app and
        # every client_id. authelia_url must be a subdomain of `domain`.
        - domain: 'c2sm-tds.c2sm.cscs.ch'
          authelia_url: 'https://auth-prometheus-dev.c2sm-tds.c2sm.cscs.ch'
          default_redirection_url: 'https://prometheus-dev.c2sm-tds.c2sm.cscs.ch/browser/'

    regulation:
      max_retries: 5
      find_time: '2m'
      ban_time: '10m'

    # PostgresCluster `authelia` (authelia-postgrescluster.yaml). The password
    # comes from PGO's generated authelia-pguser-authelia Secret via
    # AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE on the Deployment.
    #
    # Was SQLite until the OIDC tables reached ~47k rows. Authelia's schema
    # has no index on `signature`, which is what the token endpoint looks a
    # code up by, so every code exchange scanned the whole authorization-code
    # table - 10-50s per login - and SQLite's single-writer journal turned
    # concurrent OIDC requests into "database is locked" login failures.
    # Postgres fixes the locking outright and makes the unindexed scan
    # irrelevant at this row count.
    #
    # `address` (not host/port) is the 4.38+ spelling; `authelia-primary` is
    # the Service PGO creates for the cluster's primary instance.
    # PGO issues the Postgres server certificate from its own CA
    # (CN=postgres-operator-ca), which is in no system trust store, and its
    # pg_hba.conf has only `hostssl ... scram-sha-256` - there is no plaintext
    # rule to fall back to. Both halves are required: without the CA here the
    # connection fails verification, without TLS at all Postgres rejects it
    # outright with "no pg_hba.conf entry ... no encryption".
    certificates_directory: '/certs'

    storage:
      postgres:
        # `authelia-primary.eoapi-dev.svc`, not the .cluster.local form: the
        # certificate's SAN carries the fully-qualified name with a trailing
        # dot ("...cluster.local."), and this spelling matches a SAN exactly
        # with no dot-normalisation to depend on.
        address: 'tcp://authelia-primary.eoapi-dev.svc:5432'
        database: 'authelia'
        schema: 'public'
        username: 'authelia'
        timeout: '5s'
        tls:
          server_name: 'authelia-primary.eoapi-dev.svc'
          minimum_version: 'TLS1.2'

    notifier:
      disable_startup_check: true
      filesystem:
        filename: '/data/notification.txt'

    identity_providers:
      oidc:
        # `key` accepts only a PEM literal, never a path, so it is inlined at
        # startup by Authelia's `template` config filter (X_AUTHELIA_CONFIG_FILTERS
        # in the Deployment). This file must contain no other Go template syntax.
        jwks:
          - key_id: 'eoapi-dev'
            algorithm: 'RS256'
            use: 'sig'
            key: {{ secret "/secrets/oidc-jwks.pem" | mindent 10 "|" | msquote }}

        # Without this, browsers block the SPAs' cross-origin fetches of the
        # discovery doc and the token endpoint.
        cors:
          endpoints:
            - 'authorization'
            - 'token'
            - 'revocation'
            - 'introspection'
            - 'userinfo'
          allowed_origins_from_client_redirect_uris: true

        lifespans:
          # Scoped to the notebook client (lifespan: 'notebook' below) so the
          # SPAs keep the 1h default.
          custom:
            notebook:
              # Long, because it is the ONLY lever on how often a notebook
              # user logs in again. Authelia grants offline_access (and so a
              # refresh token) only in the authorization code or hybrid flow
              # - never the device grant - so there is nothing to renew with,
              # and narthex_client caches this token on disk and re-runs the
              # device flow when it expires.
              #
              # The cost is revocation lag: stac-auth-proxy validates the JWT
              # against the JWKS rather than introspecting, so a group change
              # or a disabled account does not take effect for a presented
              # token until it expires. Acceptable here (the data is public
              # and the risk model is inconvenience); shorten it if that ever
              # stops being true.
              access_token: '7d'
              # Leave short: this is the window in which an unapproved device
              # code can still be redeemed.
              device_code: '10m'

        authorization_policies:
          eoapi_users:
            default_policy: 'deny'
            rules:
              - policy: 'one_factor'
                subject:
                  - 'group:/eoapi-dev-users'

        claims_policies:
          eoapi:
            # 4.39 serves non-standard claims from /userinfo by default. Both
            # resource servers read claims off the presented token, and the
            # token the SPAs present is the ACCESS token.
            id_token:
              - 'groups'
              - 'email'
              - 'email_verified'
              - 'preferred_username'
              - 'name'
            access_token:
              - 'groups'
              - 'email'
              - 'preferred_username'

        clients:
          # Both public + PKCE, so there are no client secrets anywhere.
          # Three settings are non-obvious and all are required:
          #   access_token_signed_response_alg - access tokens are opaque by
          #     default, and the SPAs send their access token as the bearer
          #     that stac-auth-proxy / narthex-backend validate.
          #   requested_audience_mode - Authelia grants no audience unless the
          #     client asks, and oidc-client-ts never asks.
          #   consent_mode - one consent click ever, not one per login.
          - client_id: 'stac-browser'
            client_name: 'STAC Browser'
            public: true
            require_pkce: true
            pkce_challenge_method: 'S256'
            authorization_policy: 'eoapi_users'
            consent_mode: 'implicit'
            claims_policy: 'eoapi'
            audience:
              - 'stac-browser'
            requested_audience_mode: 'implicit'
            access_token_signed_response_alg: 'RS256'
            scopes:
              - 'openid'
              - 'profile'
              - 'email'
              - 'groups'
            # Deliberately NOT 'offline_access', which would be the obvious way
            # to give these SPAs a refresh token. Authelia forces a consent
            # screen on every authorization request that asks for it, whatever
            # `consent_mode` says, and refuses to pre-configure it away: with
            # `consent_mode: 'pre-configured'` it stores the grant with
            # offline_access stripped out (verified - the row in
            # oauth2_consent_preconfiguration reads `openid|email|profile|groups`),
            # so the stored consent can never match the request and the prompt
            # returns every single time. Refresh tokens and silent login are
            # mutually exclusive here.
            #
            # These SPAs do not need one. Renewal goes through a hidden iframe
            # to the authorization endpoint with prompt=none, which Authelia
            # answers from the session cookie with a 303 straight back to the
            # app's own origin - its X-Frame-Options only ever applies to
            # pages Authelia itself renders. Sessions therefore last as long
            # as the Authelia session (12h, 4h inactivity) rather than as long
            # as a refresh token, which is the right bound for a browser app.
            redirect_uris:
              - 'https://prometheus-dev.c2sm-tds.c2sm.cscs.ch/browser/auth'

          - client_id: 'narthex'
            client_name: 'Narthex'
            public: true
            require_pkce: true
            pkce_challenge_method: 'S256'
            authorization_policy: 'eoapi_users'
            consent_mode: 'implicit'
            claims_policy: 'eoapi'
            audience:
              - 'narthex'
            requested_audience_mode: 'implicit'
            access_token_signed_response_alg: 'RS256'
            scopes:
              - 'openid'
              - 'profile'
              - 'email'
              - 'groups'
            # Deliberately NOT 'offline_access', which would be the obvious way
            # to give these SPAs a refresh token. Authelia forces a consent
            # screen on every authorization request that asks for it, whatever
            # `consent_mode` says, and refuses to pre-configure it away: with
            # `consent_mode: 'pre-configured'` it stores the grant with
            # offline_access stripped out (verified - the row in
            # oauth2_consent_preconfiguration reads `openid|email|profile|groups`),
            # so the stored consent can never match the request and the prompt
            # returns every single time. Refresh tokens and silent login are
            # mutually exclusive here.
            #
            # These SPAs do not need one. Renewal goes through a hidden iframe
            # to the authorization endpoint with prompt=none, which Authelia
            # answers from the session cookie with a 303 straight back to the
            # app's own origin - its X-Frame-Options only ever applies to
            # pages Authelia itself renders. Sessions therefore last as long
            # as the Authelia session (12h, 4h inactivity) rather than as long
            # as a refresh token, which is the right bound for a browser app.
            redirect_uris:
              - 'https://narthex-prometheus-dev.c2sm-tds.c2sm.cscs.ch/auth/callback'

          # narthex_client (github.com/C2SM/narthex, client/), the Python
          # library a launched notebook uses to re-query the origin STAC API
          # for the items a named list references. It runs on
          # jupyter-santis.cscs.ch, which authenticates against CSCS SSO - a
          # different IdP, no shared session here, and no redirect back into a
          # notebook kernel - so the device authorization grant (RFC 8628) is
          # the only workable flow. Without a token the notebook is not
          # refused but silently served the anonymous catalog
          # (DEFAULT_PUBLIC=true + custom_filters.py), and a restricted
          # collection 404s as if deleted.
          - client_id: 'narthex-python-client'
            client_name: 'Narthex Python client'
            # A notebook on a shared filesystem can keep no secret: RFC 8252
            # public client. No require_pkce, unlike the two SPAs above - PKCE
            # binds an authorization request to its code exchange, and the
            # device grant issues no authorization request to bind.
            public: true
            authorization_policy: 'eoapi_users'
            # Deliberately NOT 'implicit' like the SPAs: in a device flow the
            # consent screen is the only thing that tells the user which
            # application they are approving, which is the defence against
            # device-code phishing.
            consent_mode: 'explicit'
            # Puts `groups` in the ACCESS token, which is the claim
            # stac-auth-proxy's filters authorize against. Without it the
            # token buys exactly the anonymous view.
            claims_policy: 'eoapi'
            # Authelia access tokens are opaque by default; both resource
            # servers validate a JWT against the JWKS.
            access_token_signed_response_alg: 'RS256'
            # 'stac-browser' is the one audience both resource servers already
            # accept - stac-auth-proxy's ALLOWED_JWT_AUDIENCES and
            # narthex-backend's oidcAudiences - so reusing it lets one
            # notebook token reach both with no edit on either side. The
            # second value grants nothing further: it only makes notebook
            # tokens identifiable in logs and leaves a hook should these ever
            # need filtering apart from browser tokens.
            audience:
              - 'stac-browser'
              - 'narthex-python-client'
            requested_audience_mode: 'implicit'
            # Device grant only. No refresh_token grant and no offline_access
            # scope deliberately: Authelia issues refresh tokens only for the
            # authorization code and hybrid flows, so both would be inert
            # here, and its validator warns that offline_access without a
            # code-bearing response type becomes an error in a later version.
            # Longevity comes from the 'notebook' access token lifespan above.
            grant_types:
              - 'urn:ietf:params:oauth:grant-type:device_code'
            scopes:
              - 'openid'
              - 'profile'
              - 'email'
              - 'groups'
            lifespan: 'notebook'
            # No redirect_uris: the device flow has no redirect.
