# ForwardAuth for the narthex subdomain only. Everything else on the family is
# gated by Authelia directly (authelia-middleware.yaml) or authenticates itself.
#
# Referenced as `eoapi-dev-eoapi-dev-oauth-forwardauth@kubernetescrd`, i.e.
# <namespace>-<name>@kubernetescrd. A typo silently drops the entire router and
# requests fall through to some other route rather than erroring.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: eoapi-dev-oauth-forwardauth
  namespace: eoapi-dev
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/part-of: eoapi-dev-auth-authelia
spec:
  forwardAuth:
    address: http://eoapi-dev-oauth2-proxy.eoapi-dev.svc.cluster.local:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      # Authorization is the whole point of keeping this component: it carries
      # the id_token (aud eoapi-narthex) that narthex-backend validates.
      - Authorization
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Groups
      - X-Auth-Request-Preferred-Username
      - X-Forwarded-User
      - X-Forwarded-Email
      - X-Forwarded-Groups
      - X-Forwarded-Preferred-Username
---
# Turns oauth2-proxy's 401 into a redirect into the login flow, which is what a
# browser hitting the SPA anonymously needs.
#
# This middleware rewrites *any* 401/403 from *any* backend it fronts into an
# HTML redirect, so it must never be attached to an API path - it would mangle
# narthex-backend's clean JSON 401s and silently break the widget's fetch()
# calls. It is deliberately absent from the /api Ingress in
# ../narthex-ingress.yaml. Authelia's own ForwardAuth needs no counterpart to
# this at all, since it issues the redirect itself.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: narthex-oauth-errors
  namespace: eoapi-dev
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/part-of: eoapi-dev-auth-authelia
spec:
  errors:
    status:
      - "401-403"
    service:
      name: eoapi-dev-oauth2-proxy
      port: 4180
    query: /oauth2/sign_in?rd=https://narthex-prometheus-dev.c2sm-tds.c2sm.cscs.ch/
    statusRewrites:
      "401": 302
