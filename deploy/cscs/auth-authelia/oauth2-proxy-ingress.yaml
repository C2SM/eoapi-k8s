# oauth2-proxy's own endpoints (/oauth2/start, /oauth2/callback, /oauth2/auth,
# /oauth2/sign_out) on the narthex host - the only host it gates.
#
# Only the IP allowlist here: putting the ForwardAuth middleware on the very
# endpoints that perform the login would be a redirect loop.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eoapi-dev-oauth2-proxy
  namespace: eoapi-dev
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/part-of: eoapi-dev-auth-authelia
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: "eoapi-dev-eoapi-dev-ipallowlist@kubernetescrd"
    # Must beat the narthex /api Ingress's 1000 and the SPA's default, or /oauth2
    # falls through to one of them.
    traefik.ingress.kubernetes.io/router.priority: "1500"
spec:
  ingressClassName: traefik
  rules:
    - host: narthex-prometheus-dev.c2sm-tds.c2sm.cscs.ch
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: eoapi-dev-oauth2-proxy
                port:
                  number: 4180
  tls:
    - hosts:
        - narthex-prometheus-dev.c2sm-tds.c2sm.cscs.ch
      secretName: narthex-eoapi-dev-tls
