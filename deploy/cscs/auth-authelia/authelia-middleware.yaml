# ForwardAuth for the eoAPI host. Protects only what has no auth of its own:
# /raster, /vector, /multidim and the / doc server. /stac and /browser are
# `bypass` rules in Authelia's access_control; narthex is not on this host.
#
# trustForwardHeader is required: Traefik calls the auth server with GET and
# puts the real method, host and path in X-Forwarded-*, which is where
# Authelia reads them from - and it is what makes the OPTIONS bypass rule work.
#
# There is deliberately no companion `errors` middleware: Authelia's
# ForwardAuth returns the 302 to its login portal itself.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: eoapi-dev-authelia-forwardauth
  namespace: eoapi-dev
  labels:
    app.kubernetes.io/name: authelia
    app.kubernetes.io/part-of: eoapi-dev-auth-authelia
spec:
  forwardAuth:
    address: http://eoapi-dev-authelia.eoapi-dev.svc.cluster.local:9091/api/authz/forward-auth
    trustForwardHeader: true
    maxResponseBodySize: 8192
    # Authelia's identity headers. Nothing consumes them today - the gate is
    # whole-site authorization only - and there is no Authorization here
    # because Authelia's ForwardAuth does not mint or inject a JWT.
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Email
      - Remote-Name
