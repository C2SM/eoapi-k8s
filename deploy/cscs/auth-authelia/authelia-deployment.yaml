apiVersion: apps/v1
kind: Deployment
metadata:
  name: eoapi-dev-authelia
  namespace: eoapi-dev
  labels:
    app.kubernetes.io/name: authelia
    app.kubernetes.io/part-of: eoapi-dev-auth-authelia
spec:
  replicas: 1
  # Storage is Postgres and sessions are Redis, so nothing here is
  # single-writer any more and this could be scaled out. Left at one replica
  # with Recreate because there is no reason to run two for this load, and a
  # rolling pair would only widen the window where two pods disagree about a
  # just-rotated config.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: authelia
      app.kubernetes.io/part-of: eoapi-dev-auth-authelia
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authelia
        app.kubernetes.io/part-of: eoapi-dev-auth-authelia
    spec:
      # Kubernetes injects <SERVICE_NAME>_SERVICE_HOST-style env vars for every
      # Service in the namespace, and the PostgresCluster is called `authelia`,
      # so those land as AUTHELIA_HA_*, AUTHELIA_PRIMARY_*, AUTHELIA_REPLICAS_*
      # - colliding with the AUTHELIA_ prefix Authelia reads its own config
      # from. Today they only produce "configuration environment variable not
      # expected" warnings, but a Service whose name maps onto a real config
      # key would silently override it. Nothing here needs service links.
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: authelia
          image: ghcr.io/authelia/authelia:4.39.22
          # Two separate list items, not "--config=...". The image's
          # entrypoint.sh execs $@ verbatim unless $1 is exactly "--config",
          # so the joined form is treated as a command name and the container
          # dies with `exec: illegal option --`.
          args:
            - --config
            - /config/configuration.yml
          ports:
            - name: http
              containerPort: 9091
          env:
            # Enables the Go-template file filter, which is what inlines the
            # OIDC signing key PEM into identity_providers.oidc.jwks[0].key
            # (that option accepts no file path). See authelia-configmap.yaml.
            - name: X_AUTHELIA_CONFIG_FILTERS
              value: template
            # Authelia loads any config key ending in `key`, `secret`,
            # `password`, `token` or `certificate_chain` from a file when the
            # env var carries the `_FILE` suffix. Keeps every secret out of
            # both the ConfigMap and git.
            - name: AUTHELIA_SESSION_SECRET_FILE
              value: /secrets/session-secret
            - name: AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
              value: /secrets/storage-encryption-key
            - name: AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE
              value: /secrets/oidc-hmac-secret
            - name: AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE
              value: /secrets/identity-validation-jwt-secret
            # Generated by PGO alongside the `authelia` PostgresCluster, so it
            # is not in authelia-secret with the rest and is not ours to set.
            # PGO rotates it by replacing this Secret; Authelia reads the file
            # once at startup, so a rotation needs a pod restart.
            - name: AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE
              value: /pgsecret/password
            - name: AUTHELIA_SESSION_REDIS_PASSWORD_FILE
              value: /secrets/redis-password
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config/configuration.yml
              subPath: configuration.yml
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: pgsecret
              mountPath: /pgsecret
              readOnly: true
            - name: pgca
              mountPath: /certs
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: eoapi-dev-authelia-config
        - name: secrets
          secret:
            secretName: authelia-secret
            defaultMode: 0400
        - name: pgsecret
          secret:
            secretName: authelia-pguser-authelia
            defaultMode: 0400
            items:
              - key: password
                path: password
        # PGO's own CA, so Authelia can verify the Postgres server certificate
        # (see certificates_directory in authelia-configmap.yaml). Only the CA
        # is projected: the tls.key in this Secret is the server's private key
        # and has no business in this pod.
        - name: pgca
          secret:
            secretName: authelia-cluster-cert
            defaultMode: 0444
            items:
              - key: ca.crt
                path: pgo-ca.crt
        # Nothing durable lives here any more - storage is Postgres, sessions
        # are Redis. The only writer left is the filesystem notifier, which
        # exists purely to satisfy Authelia's startup requirement for a
        # notifier (password reset and password change are both disabled), so
        # an emptyDir is the whole requirement.
        - name: data
          emptyDir: {}
