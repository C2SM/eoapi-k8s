# Authelia's SQLite storage. It holds OIDC authorization/refresh records and
# per-user preferences - NOT the OIDC signing key (that comes from the Secret,
# see authelia-configmap.yaml) and NOT the browser sessions (those are
# in-memory, so restarting Authelia does log everyone out; see README.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eoapi-dev-authelia-data
  namespace: eoapi-dev
  labels:
    app.kubernetes.io/name: authelia
    app.kubernetes.io/part-of: eoapi-dev-auth-authelia
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-corbo-rbd-nvme-retain
  resources:
    requests:
      storage: 1Gi
