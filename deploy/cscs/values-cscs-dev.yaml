# CSCS dev deployment for the c2sm-tds Kubernetes cluster.
# Change the storage class and PVC sizes below for Postgres data and pgBackRest repo storage.

ingress:
  enabled: true
  className: "traefik"
  host: "prometheus-dev.c2sm-tds.c2sm.cscs.ch"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-http01-traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: "eoapi-dev-eoapi-strip-prefix-middleware@kubernetescrd,eoapi-dev-eoapi-dev-ipallowlist@kubernetescrd"
  tls:
    enabled: true
    secretName: "eoapi-dev-tls"

apiServices:
  - stac
  - raster
  - vector

stac:
  enabled: true
  ingress:
    enabled: true
    path: "/stac"
  settings:
    dbUser: eoapi-stac
    envVars:
      # /catalogs: the collection groups loaded by deploy/cscs/catalogs/.
      # Read-only - transactions stay off, so no catalog write endpoints.
      ENABLE_CATALOGS_EXTENSION: "true"
      # The API landing page, which is also /browser's root page. Unset, all
      # three read "stac-fastapi". The id is not "prometheus": that is the
      # top catalog's (catalogs/catalogs.yaml).
      STAC_FASTAPI_LANDING_ID: "prometheus-dev"
      STAC_FASTAPI_TITLE: "PromETHeus"
      STAC_FASTAPI_DESCRIPTION: |
        Earth-observation, field-campaign and model data catalogued by C2SM on
        CSCS infrastructure.

        **What you see depends on your login.** Without logging in you see only
        public collections; once logged in you also see the collections your
        groups give you access to.

raster:
  enabled: true
  ingress:
    enabled: true
    path: "/raster"
  settings:
    dbUser: eoapi-stac

vector:
  enabled: true
  ingress:
    enabled: true
    path: "/vector"
  settings:
    dbUser: eoapi-stac

browser:
  enabled: true
  # Custom build with the SaveToNarthex widget compiled in - see
  # deploy/browser-narthex/. Private package, needs the same pull secret
  # as narthex-backend/narthex-frontend.
  image:
    name: ghcr.io/c2sm/eoapi-browser-narthex
    # Moving pre-release tag, rebuilt whenever the widget changes - so it must
    # be pullPolicy: Always, exactly like narthex-backend/narthex-frontend
    # below. IfNotPresent would keep serving whatever layer a node already
    # cached under this tag string, ignoring new pushes.
    tag: "v5.0.0-alpha"
    pullPolicy: Always
  imagePullSecrets:
    - name: narthex-ghcr-pull-secret
  ingress:
    enabled: true
    path: "/browser"
  # Trailing slash matters: stac-browser resolves relative links (e.g.
  # narthex's "view in browser" links) against catalogUrl per RFC 3986 -
  # without the trailing slash, "stac" is treated as a filename and gets
  # dropped when resolving e.g. "collections/<id>", producing
  # https://host/collections/<id> instead of https://host/stac/collections/<id>.
  # Client-side in-app navigation never hit this (stac-browser's own
  # link-generation compensates for it internally); externally-supplied
  # links do.
  catalogUrl: "https://prometheus-dev.c2sm-tds.c2sm.cscs.ch/stac/"
  catalogTitle: "PromETHeus"
  # C2SM logo mark, cropped/padded from https://ethz.ch/content/dam/ethz/special-interest/usys/c2sm-dam/center/logos/logo_xlarge.gif
  favicon: ""
  # Must be externally accessible; feeds the SB_authConfig openIdConnectUrl
  # the chart generates for stac-browser's oidc-client-ts-based OIDC login.
  oidcDiscoveryUrl: "https://auth-prometheus-dev.c2sm-tds.c2sm.cscs.ch/.well-known/openid-configuration"
  # The "groups" scope gets group membership into the token; Authelia also
  # needs claims_policies.eoapi to copy it out of /userinfo. Both halves are
  # required or custom_filters.py sees no groups.
  #
  # No "offline_access": Authelia prompts for consent on every request that
  # asks for it and will not pre-configure that away, so a refresh token costs
  # a consent click per login. Renewal goes through the silent-renew iframe
  # instead - see the `stac-browser` client in authelia-configmap.yaml.
  oidcScope: "openid email profile groups"
  # Authelia advertises no end_session_endpoint, so the browser's OIDC logout
  # would throw and leave the shared session standing. Its portal logout is
  # the only thing that really signs a user out - same URL as
  # narthex-frontend.logoutUrl below. `rd={url}` brings the user back to the
  # page they logged out from (the browser image fills in {url}, see
  # deploy/browser-narthex/patches/); without it they are left on Authelia's
  # sign-in form, and signing in there has no page to go back to.
  oidcLogoutUrl: "https://auth-prometheus-dev.c2sm-tds.c2sm.cscs.ch/logout?rd={url}"
  # Serves /browser/silent-renew.html and points silent_redirect_uri at it.
  # Must be listed in the `stac-browser` client's redirect_uris in
  # deploy/cscs/auth-authelia/authelia-configmap.yaml - Authelia rejects any
  # redirect URI it does not have registered.
  oidcSilentRenew: true
  # Pick up an existing Authelia session on load instead of waiting for a click.
  # Requires oidcSilentRenew above; the chart fails the render otherwise.
  oidcAutoSignIn: true
  catalogImage: "https://ethz.ch/content/dam/ethz/special-interest/usys/c2sm-dam/center/logos/logo_xlarge.gif"
  footerLinks:
    - label: "ETH Zürich"
      url: "https://ethz.ch/"
    - label: "C2SM"
      url: "https://c2sm.ethz.ch/"
  extraEnv:
    - name: SB_useTileLayerAsFallback
      value: "false"
  # buildTileUrlTemplate has no SB_* equivalent (it's a JS callback), so it's
  # the only thing left in customConfig; everything else above now flows
  # through SB_* env vars into stac-browser's own runtime-config.js.
  customConfig: |
    window.STAC_BROWSER_CONFIG.buildTileUrlTemplate = function(asset) {
      var item = asset && typeof asset.getContext === "function" ? asset.getContext() : null;
      var assetKey = asset && typeof asset.getKey === "function" ? asset.getKey() : null;
      var collection = item && item.collection;
      var itemId = item && item.id;

      if (!collection || !itemId || !assetKey) {
        return null;
      }

      return "https://prometheus-dev.c2sm-tds.c2sm.cscs.ch/raster/collections/" + encodeURIComponent(collection) +
        "/items/" + encodeURIComponent(itemId) +
        "/tiles/WebMercatorQuad/{z}/{x}/{y}.png?assets=" + encodeURIComponent(assetKey);
    };

    // Read by the SaveToNarthex widget (github.com/C2SM/narthex, widget/widgets.config.js)
    // once it's compiled into a custom browser image - see deploy/browser-narthex/.
    window.STAC_BROWSER_CONFIG.narthexApiUrl = "https://narthex-prometheus-dev.c2sm-tds.c2sm.cscs.ch/api";
    // No trailing slash: widget/SaveToNarthex.vue builds links as
    // `${adminUrl}/named-lists/${id}` - a trailing slash here produces "//".
    window.STAC_BROWSER_CONFIG.narthexAdminUrl = "https://narthex-prometheus-dev.c2sm-tds.c2sm.cscs.ch";

# narthex lives on its own subdomain (deploy/cscs/narthex-ingress.yaml), not
# the shared chart Ingress - both ingress.enabled: false below.
#
# The SPA is its own Authelia OIDC client and the backend validates bearer
# tokens itself, same as /browser + /stac. One login still covers every app
# because Authelia holds a real shared session, so the SPA's authorization
# request completes silently.
narthex-backend:
  enabled: true
  # Moving pre-release tag: IfNotPresent would serve a node's cached layer.
  image:
    pullPolicy: Always
  ingress:
    enabled: false
  authMode: "oidc"
  oidcIssuer: "https://auth-prometheus-dev.c2sm-tds.c2sm.cscs.ch"
  # narthex = the admin SPA's own client; stac-browser = the SaveToNarthex
  # widget, which calls this API cross-origin with stac-browser's token.
  oidcAudiences:
    - "narthex"
    - "stac-browser"
  corsOrigins:
    - "https://narthex-prometheus-dev.c2sm-tds.c2sm.cscs.ch"
    # The widget runs embedded in stac-browser, so its fetches come from
    # prometheus-dev.*, not narthex-prometheus-dev.*.
    - "https://prometheus-dev.c2sm-tds.c2sm.cscs.ch"
  imagePullSecrets:
    - name: narthex-ghcr-pull-secret

narthex-frontend:
  enabled: true
  image:
    pullPolicy: Always
  ingress:
    enabled: false
  apiUrl: "https://narthex-prometheus-dev.c2sm-tds.c2sm.cscs.ch/api"
  authMode: "oidc"
  oidcIssuer: "https://auth-prometheus-dev.c2sm-tds.c2sm.cscs.ch"
  oidcClientId: "narthex"
  # Must match a redirect_uri on the `narthex` client in
  # deploy/cscs/auth-authelia/authelia-configmap.yaml.
  oidcRedirectUri: "https://narthex-prometheus-dev.c2sm-tds.c2sm.cscs.ch/auth/callback"
  # Spelled out rather than left to narthex's default, because the scopes have
  # to match the `narthex` client's `scopes` in authelia-configmap.yaml -
  # request one that is not granted there and Authelia rejects the whole
  # authorization request. No "offline_access" (Authelia would prompt for
  # consent on every login) and no "groups" (narthex-backend authorizes named
  # lists by preferred_username, and every claim costs header budget - Traefik's
  # ceiling here is ~3-4 KB).
  oidcScope: "openid profile email"
  # Ends the shared Authelia session - the only thing that really logs a user
  # out of every app.
  logoutUrl: "https://auth-prometheus-dev.c2sm-tds.c2sm.cscs.ch/logout"
  # narthex's own local-dev fallback (DEV_DEFAULT_LAUNCH_CONFIGS in
  # frontend/src/launchConfigs.ts), carried over here since a deployed image
  # never falls back to it itself.
  launchConfigs:
    - id: santis-launcher
      label: Santis Earth Data Launcher
      jupyterHubUrl: https://jupyter-santis.cscs.ch
      notebookApp: narthex-launch
      uenv: eobs-lab     # name part must match `uenv status` output
      venv: narthex-named-list-viewer
      notebook: named-list-viewer
      # Shown in an acknowledgement modal before the launch proceeds. Neither
      # choice below can be made for the user from here - the uenv and the
      # reservation are picked on the Hub's own spawn form - so this is the
      # only place to say so before they land on it. Plain text, newlines
      # preserved, never rendered as HTML.
      message: |
        You will be taken to the Santis JupyterHub next. On that page you
        need to select "eobs-lab" as the uenv and "lab" as the view.

        If you plan to access grimsel data, that is currently only possible
        via the "es-data" reservation, which you have to specify under
        advanced options on that same launch page.

    - id: santis-stac-sim-viewer
      label: Santis STAC Sim Viewer
      jupyterHubUrl: https://jupyter-santis.cscs.ch
      notebookApp: narthex-launch
      uenv: eobs-lab
      venv: narthex-stac-sim-viewer
      notebook: stac-sim-viewer

    - id: "santis-test-notebook"
      label: "Santis Test Notebook"
      jupyterHubUrl: "https://jupyter-santis.cscs.ch"
      notebookApp: "lab/tree/Narthex_test.ipynb"
      message: |
        This is currently only used by C2SM devs for testing. Probably this
        is not what you want to launch.
  imagePullSecrets:
    - name: narthex-ghcr-pull-secret

docServer:
  # Replaces the stock "This is the root path /" list. Anyone landing on
  # the bare host wants the catalogue, not a directory of API prefixes -
  # but a bare redirect throws away the only place the deployment gets to
  # name itself, hence a short branded pause instead.
  #
  # Self-contained by necessity: the doc-server's webroot holds this file
  # and nothing else, so both logos are data URIs. The PromETHeus mark is
  # prometheus_logo.png (the left panel of the three-part logo artwork,
  # cropped 712x712+0+44) resized to 600px wide and quantised to 128
  # colours, which keeps the ConfigMap far below its 1MiB limit once base64
  # inflates it by a third. Regenerate with:
  #   magick prometheus_logo.png -resize 600x -strip -colors 128 out.png
  # Its own wordmark says "PROMETHEUS", so the page carries no <h1>.
  customHtml: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>PromETHeus</title>
      <!-- The whole point of this page: pause on something branded, then hand
           over to the catalogue browser. Bump the seconds here to linger.
           The target is the root of deploy/cscs/catalogs/, not /browser/,
           which lists all collections ungrouped. -->
      <meta http-equiv="refresh" content="4; url=/browser/catalogs/prometheus" />
      <link rel="icon" href="data:image/png;base64," />
      <style>
        :root { color-scheme: light dark; }
        body {
          margin: 0; min-height: 100vh; display: flex; align-items: center;
          justify-content: center; text-align: center; padding: 1.5rem;
          font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          background: #fafafa; color: #1a1a1a;
        }
        @media (prefers-color-scheme: dark) {
          body { background: #16181c; color: #e8e8e8; }
        }
        /* The artwork has an opaque white background and white detail inside it
           (clouds, temple, the figure's outline), so it cannot be keyed to
           transparency - it sits on a white card instead, which disappears into
           the light theme and stays legible on the dark one. */
        .logo {
          width: min(300px, 80vw); display: block; margin: 0 auto;
          background: #fff; border-radius: 12px; padding: 10px;
          box-shadow: 0 1px 3px rgb(0 0 0 / 0.1);
        }
        .byline {
          display: flex; align-items: center; justify-content: center; gap: 0.6rem;
          margin: 1.5rem 0 0.25rem; font-weight: 500;
        }
        .byline img { width: 40px; height: 40px; }
        p { margin: 0.25rem 0; opacity: 0.75; }
        nav { margin-top: 2rem; font-size: 0.875rem; opacity: 0.6; }
        a { color: inherit; }
        nav a { margin: 0 0.5rem; }
      </style>
    </head>
    <body>
      <main>
        <img class="logo" src="data:image/png;base64," alt="Prometheus" />
        <div class="byline">
          <img src="data:image/png;base64," alt="" />
          <span>C2SM eoAPI data catalogue</span>
        </div>
        <p>Taking you to the <a href="/browser/catalogs/prometheus">catalogue browser</a>&hellip;</p>
        <nav>
          <a href="/stac">/stac</a>
          <a href="/raster">/raster</a>
          <a href="/vector">/vector</a>
        </nav>
      </main>
    </body>
    </html>

multidim:
  enabled: false

testing:
  mockOidcServer:
    enabled: false

stac-auth-proxy:
  enabled: false

eoapi-notifier:
  enabled: false

knative:
  enabled: false

monitoring:
  metricsServer:
    enabled: false
  prometheus:
    enabled: false
  prometheusAdapter:
    enabled: false

observability:
  grafana:
    enabled: false

postgresql:
  type: "postgrescluster"

postgrescluster:
  enabled: true
  postgresVersion: 16
  postGISVersion: "3.4"
  pgBouncerReplicas: 1
  monitoring: false
  instances:
    - name: "eoapi"
      replicas: 1
      dataVolumeClaimSpec:
        storageClassName: &cscsStorageClass "ceph-corbo-rbd-nvme-retain"
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: "1Ti"
          # Auto-grow ceiling: PGO grows the PVC by 50% at 75% full, up to
          # this. Needs the operator's AutoGrowVolumes feature gate.
          limits:
            storage: "20Ti"
      resources: {}
  # pgBackRest to CSCS object storage (tenant c2sm, user prometheus-db-backup).
  # The keys live only in the eoapi-pgbackrest-s3 Secret (an s3.conf with
  # repo1-s3-key / repo1-s3-key-secret), created by hand, never in values.
  # A volume repo with no schedule or retention once filled up with archived
  # WAL and then filled pgdata; here scheduled fulls let retention expire old
  # WAL, and archive-push-queue-max drops WAL (breaking PITR until the next
  # full) instead of filling pgdata when S3 is unreachable.
  backupsEnabled: true
  pgBackRestConfig:
    configuration:
      - secret:
          name: eoapi-pgbackrest-s3
    global:
      repo1-path: /pgbackrest/eoapi-dev/eoapi/repo1
      repo1-s3-uri-style: path
      repo1-retention-full: "1"
      repo1-retention-full-type: count
      # Imports write a lot of WAL: keep it only from the latest backup (full
      # or diff) on. Older backups stay restorable, but not to points between.
      repo1-retention-archive-type: diff
      repo1-retention-archive: "1"
      compress-type: zst
      process-max: "4"
      archive-async: "y"
      archive-push-queue-max: 64GiB
    repos:
      - name: repo1
        s3:
          bucket: eoapi-dev-pgbackrest
          endpoint: rgw.cscs.ch
          # Ceph RGW ignores it, but pgBackRest requires one.
          region: us-east-1
        schedules:
          full: "0 1 * * 0"
          differential: "0 1 * * 1-6"
  patroni:
    dynamicConfiguration:
      postgresql:
        parameters:
          # 1GB forced a checkpoint every ~8s during bulk imports. Costs at
          # most 16GB of pg_wal while WAL archiving keeps up.
          max_wal_size: 16GB
          # pypgstac's loader plans SELECT * FROM items for every chunk, which
          # locks all partitions and their indexes (~3200 locks at 635
          # partitions) until the chunk commits. At the default 64, six
          # imports fill the lock table and every query spanning the
          # partitions, /stac searches too, fails with "out of shared memory".
          # Takes effect on a restart.
          max_locks_per_transaction: 1024

pgstacBootstrap:
  settings:
    # An import running as eoapi once held 91 of the 97 non-superuser
    # connections and every /stac query failed with TooManyConnectionsError.
    # So every role is capped: eoapi (bootstrap jobs) at 30, bulk imports
    # connect as eoapi-ingest, and stac, raster and vector share the read-only
    # eoapi-stac (~20 connections at rest; their pool ceilings add up to 102).
    # With eoapi and eoapi-ingest both at their caps, the APIs still have 27.
    # Both extra roles use eoapi's password (from the eoapi-pguser-eoapi Secret).
    userConnectionLimit: 30
    extraUsers:
      - name: eoapi-ingest
        connectionLimit: 40
        memberOf: [pgstac_ingest]
      - name: eoapi-stac
        connectionLimit: 50
        memberOf: [pgstac_read]

postgrescluster-narthex:
  enabled: true
  instances:
    - name: "narthex"
      replicas: 1
      dataVolumeClaimSpec:
        storageClassName: *cscsStorageClass
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: "20Gi"
