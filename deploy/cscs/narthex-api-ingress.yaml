# Dedicated Ingress for narthex-api, bypassing eoapi-dev-oauth-errors -
# that middleware rewrites ANY 401/403 response (from any backend, not
# just oauth2-proxy's own ForwardAuth check) into a 302-to-Dex-login. That
# breaks narthex-backend's own JWKS auth (backend/src/narthex/auth.py),
# which deliberately returns clean JSON 401s for the frontend's fetch()
# calls to handle themselves - same reasoning as /oauth2 and the Dex
# ingress each getting their own middleware-light Ingress (see
# auth-dex/oauth2-proxy-ingress.yaml, auth-dex/dex-ingress.yaml).
#
# skip_auth_routes in oauth2-proxy-configmap.yaml already exempts
# /narthex-api from the ForwardAuth check itself; this handles the
# separate errors-middleware problem that skip_auth_routes cannot.
#
# values-cscs-dev.yaml sets narthex-backend.ingress.enabled: false so the
# chart's own shared Ingress (and its strip-prefix middleware's prefix
# list) doesn't also claim /narthex-api - this Ingress/Middleware pair
# replaces it, CSCS-only.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  # Traefik's ingress-annotation cross-resource reference format is
  # "<namespace>-<resource-name>@kubernetescrd" (confirmed against
  # traefik-ipallowlist.yaml's eoapi-dev-ipallowlist -> referenced as
  # eoapi-dev-eoapi-dev-ipallowlist@kubernetescrd elsewhere) - this
  # resource's own name must NOT already embed the namespace prefix, or
  # the ingress annotation below resolves to a nonexistent middleware and
  # Traefik silently drops the whole router (confirmed via traefik logs:
  # "middleware ... does not exist", falling through to the /narthex
  # frontend router instead of 404/error).
  name: narthex-api-strip-prefix
  namespace: eoapi-dev
spec:
  stripPrefix:
    prefixes:
      - /narthex-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eoapi-dev-narthex-api
  namespace: eoapi-dev
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-http01-traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: "eoapi-dev-eoapi-dev-ipallowlist@kubernetescrd,eoapi-dev-narthex-api-strip-prefix@kubernetescrd"
    # Explicit, high priority: this Ingress is a separate resource from the
    # chart's shared eoapi-ingress (which still routes /narthex to
    # narthex-frontend), and /narthex-api textually starts with /narthex -
    # observed in practice that Traefik's automatic longest-rule-wins
    # priority did not reliably prefer this more specific path when the
    # two rules live in different Ingress objects. Pin it explicitly
    # rather than rely on that.
    traefik.ingress.kubernetes.io/router.priority: "1000"
spec:
  ingressClassName: traefik
  rules:
    - host: prometheus-dev.c2sm-tds.c2sm.cscs.ch
      http:
        paths:
          - path: /narthex-api
            pathType: Prefix
            backend:
              service:
                name: eoapi-narthex-backend
                port:
                  number: 8000
  tls:
    - hosts:
        - prometheus-dev.c2sm-tds.c2sm.cscs.ch
      secretName: eoapi-dev-tls
